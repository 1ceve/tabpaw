name: Finalize Codex-authored docs

on:
  push:
    branches:
      - main
    paths:
      - .github/codex-docs-pending

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == '1ceve/tabpaw' &&
      startsWith(github.event.head_commit.message, 'docs: stage Chinese troubleshooting guide')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link the bilingual troubleshooting guides
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/codex-docs-pending
          grep -Fq \
            'For the complete walkthrough, see [macOS setup](docs/setup-macos.md).' \
            README.md
          grep -Fq \
            '[排错手册](docs/troubleshooting.md)' \
            README.zh-CN.md

          perl -0pi -e \
            's{\QFor the complete walkthrough, see [macOS setup](docs/setup-macos.md).\E}{For the complete walkthrough, see [macOS setup](docs/setup-macos.md). If\nsomething goes wrong, use the [troubleshooting guide](docs/troubleshooting.md).}' \
            README.md
          perl -0pi -e \
            's{\Q[排错手册](docs/troubleshooting.md)\E}{[中文排错手册](docs/troubleshooting.zh-CN.md)}' \
            README.zh-CN.md
          rm .github/codex-docs-pending

          bash -n scripts/*.sh
          bash scripts/check-secrets.sh
          bash scripts/test-secret-scan-redaction.sh
          git diff --check

          git config user.name '1ceve'
          git config user.email \
            '273251075+1ceve@users.noreply.github.com'
          git add README.md README.zh-CN.md .github/codex-docs-pending
          git commit \
            --author='Codex <199175422+chatgpt-codex-connector[bot]@users.noreply.github.com>' \
            -m 'docs: link bilingual troubleshooting guides' \
            -m 'Point each README to the appropriate recovery guide and remove the one-time attribution marker.' \
            -m 'Co-authored-by: Codex <199175422+chatgpt-codex-connector[bot]@users.noreply.github.com>'
          git push origin HEAD:main
